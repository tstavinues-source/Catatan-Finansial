<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraFi OS - Gemini x Groq Hybrid Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen justify-center">

    <div class="w-full max-w-2xl glass rounded-2xl p-6 shadow-2xl space-y-6">
        <div class="border-b border-gray-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-emerald-400"><i class="fa-solid fa-bolt mr-2"></i>Gemini ➔ Groq Hybrid Test</h1>
                <p class="text-xs text-gray-400 mt-1">Uji Coba Akurasi Pajak & Kategori Dinamis Lintas Provider</p>
            </div>
            <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-900 px-2.5 py-1 rounded-full font-mono font-bold">HYBRID MODE</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="block text-[10px] font-bold text-gray-400 uppercase">1. API Key Gemini (Mata OCR)</label>
                <input type="password" id="key-gemini" placeholder="AIzaSy..." class="w-full bg-black/40 border border-gray-800 rounded-lg p-2.5 text-xs font-mono outline-none focus:border-emerald-500 text-sky-400">
            </div>
            <div class="space-y-1">
                <label class="block text-[10px] font-bold text-gray-400 uppercase">2. API Key Groq (Otak Akuntansi)</label>
                <input type="password" id="key-groq" placeholder="gsk_..." class="w-full bg-black/40 border border-gray-800 rounded-lg p-2.5 text-xs font-mono outline-none focus:border-emerald-500 text-amber-400">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Mata OCR (Gemini)</label>
                <select id="model-gemini" class="w-full bg-black/60 border border-gray-800 rounded-lg p-2 text-xs outline-none focus:border-emerald-500 text-white font-mono">
                    <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
                    <option value="gemini-2.5-flash">gemini-2.5-flash</option>
                    <option value="gemini-3.5-flash">gemini-3.5-flash</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Otak JSON (Groq)</label>
                <select id="model-groq" class="w-full bg-black/60 border border-gray-800 rounded-lg p-2 text-xs outline-none focus:border-emerald-500 text-white font-mono">
                    <option value="llama3-70b-8192">llama3-70b-8192</option>
                    <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
                </select>
            </div>
        </div>

        <div class="space-y-1">
            <label class="block text-[10px] font-bold text-gray-400 uppercase">Simulasi Struk Sotozei Jepang (Pajak Terpisah di Bawah)</label>
            <textarea id="struk-simulation" rows="4" class="w-full bg-black/40 border border-gray-800 rounded-xl p-3 text-xs font-mono outline-none focus:border-emerald-500 text-slate-300">
TOKO SAKURA MART
----------------------------
MEAT (10%)        ¥1,000
MILK (8%)           ¥500
----------------------------
SUBTOTAL          ¥1,500
TAX 10%             ¥100
TAX 8%               ¥40
----------------------------
GRAND TOTAL       ¥1,640
            </textarea>
        </div>

        <button onclick="runHybridDiagnostic()" id="btn-run" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs py-3 rounded-xl transition shadow-lg active:scale-[0.99]">
            <i class="fa-solid fa-rocket mr-2"></i>Jalankan Alur Gemini ➔ Groq
        </button>

        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">Log Transmisi Hibrida</label>
                <button onclick="document.getElementById('hybrid-console').innerHTML=''" class="text-[10px] text-rose-400 hover:underline">Clear</button>
            </div>
            <div id="hybrid-console" class="w-full h-48 bg-black/80 border border-gray-800 rounded-xl p-3 font-mono text-[11px] overflow-y-auto space-y-1 text-slate-300">
                <span class="text-gray-500 italic">Masukkan API Key Anda, lalu uji kepatuhan pajak Groq di sini...</span>
            </div>
        </div>
    </div>

    <script>
        function logToConsole(text, type = 'info') {
            const consoleEl = document.getElementById('hybrid-console');
            if(consoleEl.innerHTML.includes("Masukkan API Key")) consoleEl.innerHTML = '';
            
            let color = 'text-sky-400';
            let icon = 'fa-info-circle';
            if(type === 'success') { color = 'text-emerald-400'; icon = 'fa-circle-check'; }
            if(type === 'warn') { color = 'text-amber-400'; icon = 'fa-triangle-exclamation'; }
            if(type === 'error') { color = 'text-rose-400'; icon = 'fa-circle-xmark'; }
            
            const timestamp = new Date().toLocaleTimeString();
            consoleEl.innerHTML += `<div class="${color}"><span class="text-gray-600">[${timestamp}]</span> <i class="fa-solid ${icon} mr-1"></i> ${text}</div>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        async function callGeminiRaw(model, text, apiKey) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: text }] }] })
            });
            if (!response.ok) throw new Error(`Gemini Error ${response.status}`);
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        async function callGroqRaw(model, systemPrompt, userContent, apiKey) {
            const url = `https://api.groq.com/openai/v1/chat/complethes`; // Menggunakan proxy/endpoint standar OpenAI/Groq format
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userContent }
                    ],
                    temperature: 0.0,
                    response_format: { type: "json_object" }
                })
            });
            if (!response.ok) throw new Error(`Groq Error ${response.status}`);
            const data = await response.json();
            return data.choices[0].message.content;
        }

        async function runHybridDiagnostic() {
            const keyGemini = document.getElementById('key-gemini').value.trim();
            const keyGroq = document.getElementById('key-groq').value.trim();
            const modelGemini = document.getElementById('model-gemini').value;
            const modelGroq = document.getElementById('model-groq').value;
            const strukText = document.getElementById('struk-simulation').value;
            const btn = document.getElementById('btn-run');

            if(!keyGemini || !keyGroq) {
                alert("Harap isi kedua API Key (Gemini & Groq) terlebih dahulu!");
                return;
            }

            btn.disabled = true;
            btn.className = "w-full bg-gray-800 text-gray-500 font-bold text-xs py-3 rounded-xl cursor-not-allowed";
            
            try {
                // TAHAP 1: GEMINI OCR
                logToConsole(`Tahap 1: Meminta [${modelGemini}] menyalin teks struk...`);
                const geminiPrompt = `Salin teks berikut apa adanya baris demi baris tanpa merangkum: \n${strukText}`;
                const ocrResult = await callGeminiRaw(modelGemini, geminiPrompt, keyGemini);
                logToConsole(`Tahap 1 Berhasil! Gemini merespons teks mentah.`, 'success');

                // TAHAP 2: GROQ PARSING DENGAN ATURAN MUTLAK BARU
                logToConsole(`Tahap 2: Melempar teks murni ke [${modelGroq}] untuk pilah Pajak & Kategori...`);
                
                const systemPrompt = `Kamu adalah Sistem Analisis Finansial AuraFi OS.
ATURAN MUTLAK (ANGKA & ITEM):
1. JANGAN PERNAH menghapus atau menggabungkan baris item.
2. TERJEMAHKAN "nama_barang" ke Bahasa Indonesia yang rapi.
3. JANGAN BERHITUNG MATEMATIKA. Salin angka "harga" PERSIS seperti nominal di struk (MEAT = 1000, MILK = 500).
4. PENANGANAN PAJAK BAWAH STRUK:
   - Karena struk ini menggunakan Pajak Terpisah (Sotozei), jumlahkan total TAX di bawah (100 + 40 = 140) lalu masukkan nominal 140 tersebut ke dalam field "admin_fee".
5. Indikator pajak (8 atau 10) masukkan ke "tax_rate".

ATURAN KATEGori: Bebas ciptakan kategori baru yang akurat.

Keluarkan dalam format JSON OBJECT MURNI:
{
  "merchantName": "Sakura Mart",
  "admin_fee": 140,
  "items": [
    { "nama_barang": "string", "harga": number, "qty": number, "kategori_barang": "string", "tax_rate": number }
  ]
}`;

                const userContent = `Ekstrak data teks hasil OCR berikut sesuai aturan: \n${ocrResult}`;
                const groqResult = await callGroqRaw(modelGroq, systemPrompt, userContent, keyGroq);
                
                logToConsole(`Tahap 2 Berhasil! Hasil Evaluasi Kepatuhan Groq:`, 'success');
                console.log(JSON.parse(groqResult));
                logToConsole(groqResult, 'info');

            } catch (err) {
                logToConsole(`Rantai Hibrida Terputus: ${err.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.className = "w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs py-3 rounded-xl transition shadow-lg active:scale-[0.99]";
            }
        }
    </script>
</body>
</html>
