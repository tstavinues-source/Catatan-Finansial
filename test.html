<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Vision + Groq AI Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 p-4 md:p-8 font-sans min-h-screen">

    <div class="max-w-3xl mx-auto space-y-6">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl relative overflow-hidden">
            <h1 class="text-2xl font-black text-blue-400 mb-2 relative z-10"><i class="fa-solid fa-eye mr-2"></i>Gemini Vision + Groq AI</h1>
            <p class="text-xs text-slate-400 relative z-10">Pipeline: Gemini (Mata OCR) ➔ Groq (Otak JSON).</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">API Key Gemini (Mata)</label>
                    <input type="password" id="gemini-key-input" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-blue-400 font-mono focus:outline-none focus:border-blue-500 transition-colors" placeholder="AIza... atau AQ...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">API Key Groq (Otak)</label>
                    <input type="password" id="groq-key-input" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-emerald-400 font-mono focus:outline-none focus:border-emerald-500 transition-colors" placeholder="gsk_...">
                </div>
            </div>

            <textarea id="prompt-input" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="Instruksi: Fokus pada total harga dan daftar barang..."></textarea>

            <input type="file" id="image-input" accept="image/*" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-blue-500/20 file:text-blue-400 hover:file:bg-blue-500/30 transition-colors cursor-pointer">

            <button id="btn-test" class="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-bolt"></i> Eksekusi AI Pipeline
            </button>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-sm font-bold text-slate-300 mb-3 uppercase tracking-wider flex justify-between items-center">
                <span>Terminal Log & Hasil</span>
                <button id="btn-clear" class="text-xs text-slate-500 hover:text-rose-400 transition-colors">Bersihkan</button>
            </h2>
            <div id="log-output" class="bg-black/80 border border-slate-800 p-5 rounded-xl font-mono text-[11px] text-slate-300 h-80 overflow-y-auto space-y-2">
                <div class="text-slate-600">Sistem siap...</div>
            </div>
        </div>
    </div>

    <script>
        const logBox = document.getElementById('log-output');
        function uiLog(message, type = 'info') {
            const span = document.createElement('div');
            if (type === 'error') span.className = 'text-rose-400';
            else if (type === 'success') span.className = 'text-emerald-400 font-bold';
            else span.className = 'text-slate-300';
            span.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            logBox.appendChild(span);
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('btn-clear').addEventListener('click', () => logBox.innerHTML = '');

        document.getElementById('btn-test').addEventListener('click', async () => {
            const geminiKey = document.getElementById('gemini-key-input').value.trim();
            const groqKey = document.getElementById('groq-key-input').value.trim();
            const promptText = document.getElementById('prompt-input').value || 'Ekstrak detail struk ini.';
            const fileInput = document.getElementById('image-input');
            
            // Perbaikan Validasi Key
            if (!geminiKey.startsWith('AIza') && !geminiKey.startsWith('AQ')) return alert("API Key Gemini salah (gunakan AIza... atau AQ...)");
            if (!groqKey.startsWith('gsk_')) return alert("API Key Groq salah!");
            if (!fileInput.files[0]) return alert("Pilih gambar struk!");

            document.getElementById('btn-test').disabled = true;
            
            const reader = new FileReader();
            reader.readAsDataURL(fileInput.files[0]);
            reader.onload = async () => {
                await eksekusiAIPipeline(promptText, reader.result, geminiKey, groqKey);
            };
        });

        async function eksekusiAIPipeline(prompt, imageStr, geminiKey, groqKey) {
            try {
                uiLog("👁️ Gemini sedang membaca gambar...");
                const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`;
                const geminiPayload = { contents: [{ role: "user", parts: [
                    { text: "Tulis ulang teks dalam gambar ini baris demi baris, jangan ringkas." },
                    { inlineData: { mimeType: imageStr.match(/data:([a-zA-Z0-9]+\/[a-zA-Z0-9-.+]+)/)[1], data: imageStr.split(',')[1] } }
                ]}]};

                const resGem = await fetch(geminiUrl, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(geminiPayload) });
                if (!resGem.ok) throw new Error("Gemini Gagal: " + resGem.status);
                const dataGem = await resGem.json();
                const teksMentah = dataGem.candidates[0].content.parts[0].text;
                uiLog("--- TEKS MENTAH DITERIMA ---");
                uiLog(teksMentah);

                uiLog("🧠 Groq sedang menyusun JSON...");
                const groqPayload = {
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "system", content: "Parser keuangan JSON murni saja. Format: {\"total_belanja\": 0, \"toko\": \"\", \"daftar_barang\": []}" }, { role: "user", content: `Teks: ${teksMentah}\n\nInstruksi: ${prompt}` }]
                };

                const resGroq = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST", headers: {"Authorization": `Bearer ${groqKey}`, "Content-Type": "application/json"},
                    body: JSON.stringify(groqPayload)
                });
                const dataGroq = await resGroq.json();
                uiLog("--- HASIL AKHIR ---", "success");
                uiLog(dataGroq.choices[0].message.content.trim(), "success");

            } catch (err) { uiLog(err.message, "error"); } 
            finally { document.getElementById('btn-test').disabled = false; }
        }
    </script>
</body>
</html>
