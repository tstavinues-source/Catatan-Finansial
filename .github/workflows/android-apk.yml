name: Bangun APK Android

# Membangun APK AuraFi (debug, bisa langsung dipasang di HP) setiap ada
# perubahan di main / branch Android, atau dijalankan manual dari tab Actions.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/android-capacitor
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Pasang dependensi
        run: npm install

      - name: Salin aset web ke www/
        run: npm run sync:www

      - name: Buat platform Android
        run: npx cap add android

      - name: Sinkronkan aset ke proyek Android
        run: npx cap sync android

      - name: Bangun APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraFi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
